---
created:
  $fromNow: 0 seconds
deadline:
  $fromNow: 2 hours
expires:
  $fromNow: 1 month
extra: {}
metadata:
  name: Reviewer assignment (development)
  description: Assign reviewers for PRs in the mozilla-conduit dev repos (ff-test)
  owner: conduit-team@mozilla.com
  source: 'https://github.com/mozilla-conduit/reviewer-selector'
payload:
  capabilities: {}
  env:
    SENTRY_ENVIRONMENT: development
    TC_SECRET_ID: project/engwf/reviewer-assignment/runtime-development
    PR_URL:
      $if: 'defined("payload.body")'
      then:
        $eval: payload.body.pull_request.html_url
      else:
        ""
    PHABRICATOR_REVISION_PHID:
      $if: 'defined("payload.revision_phid")'
      then:
        $eval: payload.revision_phid
      else:
        ""

  features:
    taskclusterProxy: true
  image:
    type: indexed-image
    namespace: mozilla.v2.reviewer-selector.branch.develop.latest.docker-image.reviewer-selector
    path: public/image.tar.zst
  maxRunTime: 600
priority: lowest
provisionerId: reviewer-assignment
retries: 3
routes:
  - index.project.engwf.development.reviewer-assignment.latest
  - $if: 'defined("payload.organization")'
    then:
      $eval: 'index.project.engwf.development.reviewer-assignment.${payload.organization}.${payload.repository}.latest'
    else:
      $eval: 'index.project.engwf.development.reviewer-assignment.phabricator.${payload.callsign}.latest'
  - $if: 'defined("payload.organization")'
    then:
      $eval: 'index.project.engwf.development.reviewer-assignment.${payload.organization}.${payload.repository}.pull-request.${payload.body.number}'
    else:
      $eval: 'index.project.engwf.development.reviewer-assignment.phabricator.${payload.callsign}.revision.D${payload.revision_id}'
  - $if: 'defined("payload.organization")'
    then:
      $eval: 'index.project.engwf.development.reviewer-assignment.${payload.organization}.${payload.repository}.commit.${payload.body.pull_request.head.sha}'
    else:
      $eval: 'index.project.engwf.development.reviewer-assignment.phabricator.${payload.callsign}.diff.${payload.diff_id}'
schedulerId: engwf
scopes:
  - 'secrets:get:project/engwf/reviewer-assignment/runtime-development'
  - 'index:insert-task:project.engwf.development.reviewer-assignment.*'
tags: {}
workerType: bot
