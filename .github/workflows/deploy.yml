---
name: deploy
on:  # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}
  workflow_call:
    inputs:
      trigger_reason:
        description: "Human-readable note describing what triggered this deploy."
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ["staging", "firefoxci"]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FXCI_CONFIG_CACHE: ${{github.workspace}}/cache.${{matrix.environment}}.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Load environment config
        # Hardcoded (not sourced from vars) because GitHub withholds
        # environment-scoped vars/secrets from pull_request runs triggered
        # from forks; the root URL isn't sensitive, so it doesn't need to
        # live behind that gate. No TASKCLUSTER_CLIENT_ID/ACCESS_TOKEN here:
        # `generate` never calls `current.resources()`, so it never
        # authenticates against Taskcluster.
        run: |
          if [ "${{ matrix.environment }}" == "staging" ]; then
            echo "TASKCLUSTER_ROOT_URL=https://stage.taskcluster.nonprod.webservices.mozgcp.net" >> "$GITHUB_ENV"
          elif [ "${{ matrix.environment }}" == "firefoxci" ]; then
            echo "TASKCLUSTER_ROOT_URL=https://firefox-ci-tc.services.mozilla.com" >> "$GITHUB_ENV"
          fi
      - name: Generate config
        run: uv run tc-admin generate --environment ${{matrix.environment}} --resources all --json > "$FXCI_CONFIG_CACHE"
      - name: Upload config cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fxci-config-cache-${{matrix.environment}}
          path: ${{ env.FXCI_CONFIG_CACHE }}
          retention-days: 1

  check:
    runs-on: ubuntu-latest
    needs: generate
    strategy:
      matrix:
        environment: ["staging", "firefoxci"]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GCP_CHECK_TOKEN: ${{ secrets.GCP_CHECK_TOKEN }}
      FXCI_CONFIG_CACHE: ${{github.workspace}}/cache.${{matrix.environment}}.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Set root url
        run: |
          if [ "${{ matrix.environment }}" == "staging" ]; then
            echo "TASKCLUSTER_ROOT_URL=https://stage.taskcluster.nonprod.webservices.mozgcp.net" >> "$GITHUB_ENV"
          elif [ "${{ matrix.environment }}" == "firefoxci" ]; then
            echo "TASKCLUSTER_ROOT_URL=https://firefox-ci-tc.services.mozilla.com" >> "$GITHUB_ENV"
          fi
      - name: Download config cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fxci-config-cache-${{matrix.environment}}
          path: ${{github.workspace}}
      - name: Run checks
        run: uv run tc-admin check --environment ${{matrix.environment}} --generated "$FXCI_CONFIG_CACHE"

  diff:
    runs-on: ubuntu-latest
    environment: diff-${{matrix.environment}}
    needs: generate
    strategy:
      matrix:
        environment: ["staging", "firefoxci"]
    env:
      # Github doesn't set these on PR events from a fork, but that's ok as we
      # skip generating resources that require scopes with PRs anyway.
      TASKCLUSTER_CLIENT_ID: ${{vars.TASKCLUSTER_CLIENT_ID}}
      TASKCLUSTER_ACCESS_TOKEN: ${{secrets.TASKCLUSTER_ACCESS_TOKEN}}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FXCI_CONFIG_CACHE: ${{github.workspace}}/cache.${{matrix.environment}}.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Set root url
        run: |
          if [ "${{ matrix.environment }}" == "staging" ]; then
            echo "TASKCLUSTER_ROOT_URL=https://stage.taskcluster.nonprod.webservices.mozgcp.net" >> "$GITHUB_ENV"
          elif [ "${{ matrix.environment }}" == "firefoxci" ]; then
            echo "TASKCLUSTER_ROOT_URL=https://firefox-ci-tc.services.mozilla.com" >> "$GITHUB_ENV"
          fi
      - name: Download config cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fxci-config-cache-${{matrix.environment}}
          path: ${{github.workspace}}
      - name: Generate diff
        run: |
          exit_code=0

          resources_args=()
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # skip diffing clients for pull requests; we require scopes for
            # that, and we don't want to give scopes to pull requests.
            resources_args=(--resources cron_tasks,git_pushes,grants,hg_pushes,hooks,in_tree_actions,scm_group_roles,worker_pools)
          fi

          uv run tc-admin diff --environment ${{matrix.environment}} --generated "$FXCI_CONFIG_CACHE" ${resources_args[@]}" || exit_code=$?

          if [ "${exit_code}" == "2" ]; then
            # exit code 2 means a diff was found; this is not an error
            exit 0;
          fi

          # other errors should be raised
          exit "${exit_code}"

  apply:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: [generate, check]
    environment: apply-${{matrix.environment}}
    # Serialize only the actual deploy into a single group so only one apply
    # ever runs at a time. A trigger arriving mid-deploy queues one pending
    # run rather than starting a concurrent apply. cancel-in-progress is
    # false so an in-flight apply is never interrupted. Checks (including on
    # PRs) are unaffected and always run immediately.
    concurrency:
      group: deploy-apply-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      matrix:
        environment: ["firefoxci"]
    env:
      TASKCLUSTER_ROOT_URL: ${{vars.TASKCLUSTER_ROOT_URL}}
      TASKCLUSTER_CLIENT_ID: ${{vars.TASKCLUSTER_CLIENT_ID}}
      TASKCLUSTER_ACCESS_TOKEN: ${{secrets.TASKCLUSTER_ACCESS_TOKEN}}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FXCI_CONFIG_CACHE: ${{github.workspace}}/cache.${{matrix.environment}}.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Download config cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fxci-config-cache-${{matrix.environment}}
          path: ${{github.workspace}}
      - name: Deploy environment
        id: apply_config
        run: uv run tc-admin apply --environment ${{matrix.environment}} --generated "$FXCI_CONFIG_CACHE"

  notify:
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    needs: [check, apply]
    steps:
      - name: Notify Slack
        if: always()
        env:
          # All dynamic values arrive as env vars, never interpolated into the
          # script body -- so nothing (notably TRIGGER_REASON) can inject shell.
          TRIGGER_REASON: ${{ inputs.trigger_reason }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          CHECK_RESULT: ${{ needs.check.result }}
          APPLY_RESULT: ${{ needs.apply.result }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ "$CHECK_RESULT" = "success" ]; then
            CHECK_LINE=":white_check_mark: check succeeded"
          else
            CHECK_LINE=":x: check failed"
          fi

          if [ "$APPLY_RESULT" = "success" ]; then
            APPLY_LINE=":white_check_mark: apply succeeded"
          else
            APPLY_LINE=":x: apply failed"
          fi

          SHORT_SHA=$(echo "$SHA" | cut -c1-7)
          RESOLVED_TEXT="Deploy of <https://github.com/${REPO}|${REPO}> from <https://github.com/${REPO}/commit/${SHA}|${SHORT_SHA}> is resolved"
          LINK_TEXT="<https://github.com/${REPO}/actions/runs/${RUN_ID}|View Workflow>"

          # Build the payload with jq so every value is JSON-escaped; the status
          # lines (and optional reason) are joined with newlines inside jq.
          SLACK_MESSAGE=$(jq -n \
            --arg resolved "$RESOLVED_TEXT" \
            --arg check "$CHECK_LINE" \
            --arg apply "$APPLY_LINE" \
            --arg reason "$TRIGGER_REASON" \
            --arg link "$LINK_TEXT" \
            '($check + "\n" + $apply + (if $reason != "" then "\n" + $reason else "" end)) as $status
             | {blocks: [
                 {type: "section", text: {type: "mrkdwn", text: $resolved}},
                 {type: "divider"},
                 {type: "section", text: {type: "mrkdwn", text: $status}},
                 {type: "section", text: {type: "mrkdwn", text: $link}}
               ]}')

          curl -X POST -H 'Content-type: application/json' \
            --data "$SLACK_MESSAGE" "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack notification POST failed"
